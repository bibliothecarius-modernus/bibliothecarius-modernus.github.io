# Deployment: This site uses GitHub Actions for builds (not standard GitHub Pages)
# Custom plugins in _plugins/ require this. See .github/workflows/ for build config.

# Site settings
title: Bibliothecarius Modernus
subtitle: The Modern Librarian
motto: "Antiqua servare, nova quaerere"
# description: the site's meta description (search snippets). Curator-controlled copy (Phase 8C);
# this is the homepage tagline. Owner review pending for a longer SEO sentence, if wanted.
description: "Antiqua servare, nova quaerere — Latin Patristic texts in translation"
# identity: the D040 identity sentence, used only in machine-readable metadata (metadata.json publisher.identity).
identity: "Bibliothecarius Modernus is an independent digital library of neglected Latin literature, publishing complete open translations, parallel texts, contextual research, audio and video editions, and machine-readable scholarly data — and, where the sources require it, new transcriptions from manuscripts."
baseurl: ""
url: "https://bibliothecarius-modernus.github.io"

# Social media
youtube_username: BibliothecariusModernus
github_username: wryan14
archive_link: https://archive.org/details/@ryan_wolfslayer

# Additional resources
resource_links:
  latin_texts: https://github.com/wryan14/Latin-Patristic-Texts

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Permalink format - simple date-based URLs without categories
permalink: /:year/:month/:title/

# Collections
collections:
  research:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Bibliothecarius Modernus"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
    values:
      image: "/assets/images/bibliothecarius-logo.png"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md
  - _docs

# SEO settings
twitter:
  username: 
  card: summary_large_image
logo: /assets/images/bibliothecarius-logo.png
social:
  name: Bibliothecarius Modernus
  links:
    - https://youtube.com/@BibliothecariusModernus
    - https://github.com/wryan14
    - https://archive.org/details/@ryan_wolfslayer

# Google Analytics (if you want to add it later)
google_analytics: G-M2D8QRDQC7